name: Publicar conteúdo agendado

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/publicar-agendamentos.mjs
      - name: Registrar publicação
        run: |
          if git diff --quiet; then
            echo "Nenhum agendamento para publicar."
            exit 0
          fi
          git config user.name "KM Painel"
          git config user.email "km-painel@users.noreply.github.com"
          git add content
          git commit -m "Publica conteúdo agendado"
          git push
