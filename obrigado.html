<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensagem enviada — KM Centro de Aprendizagem</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--creme); }
  .obrigado-box {
    text-align: center;
    max-width: 520px;
    padding: 3rem 2rem;
  }
  .obrigado-icone {
    font-size: 4rem;
    margin-bottom: 1.5rem;
  }
  .obrigado-box h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--texto);
    margin-bottom: 1rem;
  }
  .obrigado-box p {
    color: var(--texto-suave);
    font-size: 1rem;
    line-height: 1.8;
    margin-bottom: 2rem;
  }
  .obrigado-box .verde { color: var(--verde); }
</style>
</head>
<body>
  <div class="obrigado-box">
    <div class="obrigado-icone">✉️</div>
    <h1>Mensagem <em class="verde">recebida!</em></h1>
    <p>Obrigada pelo contato. Em breve retornarei para conversarmos sobre como posso te ajudar.</p>
    <a href="/" class="btn-primary">← Voltar ao site</a>
  </div>
</body>
</html>
