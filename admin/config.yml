backend:
  name: github
  repo: mraxlrose/profekaryne
  branch: main
  base_url: https://km-cms-auth.mraxlrose.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "{{author-name}} cria {{path}}"
    update: "{{author-name}} atualiza {{path}}"
    delete: "{{author-name}} remove {{path}}"
    uploadMedia: "{{author-name}} envia {{path}}"

publish_mode: editorial_workflow
locale: pt
show_preview_links: false

# Necessário ao Decap CMS; imagens enviadas pelo painel ficam nesta pasta.
media_folder: assets/img/uploads
public_folder: /assets/img/uploads

collections:
  - name: site
    label: Textos do site
    files:
      - name: conteudo-principal
        label: Conteúdo das seções
        file: content/site.json
        format: json
        fields:
          - label: Início
            name: hero
            widget: object
            fields:
              - { label: Selo, name: selo, widget: string }
              - { label: Título (antes da palavra em destaque), name: titulo, widget: string }
              - { label: Palavra em destaque, name: destaque, widget: string }
              - { label: Complemento do título, name: complemento, widget: string }
              - { label: Texto de apresentação, name: descricao, widget: text }
          - label: Sobre
            name: sobre
            widget: object
            fields:
              - { label: Selo, name: selo, widget: string }
              - { label: Nome no título, name: titulo, widget: string }
              - { label: Subtítulo, name: subtitulo, widget: string }
              - label: Parágrafos
                name: paragrafos
                widget: list
                field: { label: Parágrafo, name: texto, widget: text }
          - label: Serviços
            name: servicos
            widget: object
            fields:
              - { label: Selo, name: selo, widget: string }
              - { label: Título, name: titulo, widget: string }
              - { label: Texto introdutório, name: descricao, widget: text }
              - label: Cards de serviços
                name: itens
                widget: list
                fields:
                  - { label: Título, name: titulo, widget: string }
                  - { label: Descrição, name: descricao, widget: text }
          - label: Redação
            name: redacao
            widget: object
            fields:
              - { label: Selo, name: selo, widget: string }
              - { label: Título, name: titulo, widget: string }
              - { label: Texto introdutório, name: descricao, widget: text }
          - label: Horários
            name: horarios
            widget: object
            fields:
              - { label: Selo, name: selo, widget: string }
              - { label: Título, name: titulo, widget: string }
              - { label: Texto introdutório, name: descricao, widget: text }
          - label: Valores
            name: valores
            widget: object
            fields:
              - { label: Selo, name: selo, widget: string }
              - { label: Título, name: titulo, widget: string }
              - { label: Texto introdutório, name: descricao, widget: text }
          - label: Jogos
            name: jogos
            widget: object
            fields:
              - { label: Selo, name: selo, widget: string }
              - { label: Título, name: titulo, widget: string }
              - { label: Texto introdutório, name: descricao, widget: text }
          - label: Contato
            name: contato
            widget: object
            fields:
              - { label: Selo, name: selo, widget: string }
              - { label: Título, name: titulo, widget: string }
              - { label: Texto introdutório, name: descricao, widget: text }

  - name: operacao
    label: Horários e atendimento
    files:
      - name: agenda
        label: Horários, pagamentos e avisos de agenda
        file: content/agenda.json
        format: json
        fields:
          - label: Horários semanais
            name: horarios
            widget: object
            fields:
              - { label: Observação abaixo da tabela, name: observacao, widget: string }
              - { label: Duração das aulas, name: duracao, widget: string }
              - { label: Formas de pagamento, name: pagamento, widget: string }
              - label: Linhas da tabela (dia, manhã, tarde, noite)
                name: linhas
                widget: list
                fields:
                  - { label: Dia, name: dia, widget: string }
                  - { label: Manhã, name: manha, widget: string }
                  - { label: Tarde, name: tarde, widget: string }
                  - { label: Noite, name: noite, widget: string }
          - label: Aviso temporário no topo
            name: aviso
            widget: object
            fields:
              - { label: Exibir aviso, name: ativo, widget: boolean, default: false }
              - { label: Texto do aviso, name: texto, widget: string, required: false }

  - name: contatos
    label: Contatos e botões
    files:
      - name: dados-de-contato
        label: WhatsApp, e-mail e redes sociais
        file: content/contatos.json
        format: json
        fields:
          - label: Contato
            name: contato
            widget: object
            fields:
              - { label: WhatsApp (somente números com DDI), name: whatsappNumero, widget: string, hint: "Exemplo: 5554992530598", pattern: ['^55\\d{10,11}$', 'Use somente números, começando por 55.'] }
              - { label: WhatsApp exibido no site, name: whatsappExibicao, widget: string, pattern: ['^\\(\\d{2}\\)\\s9\\s?\\d{4}-\\d{4}$', 'Use o formato (54) 9 9253-0598.'] }
              - { label: E-mail, name: email, widget: string, pattern: ['^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$', 'Informe um e-mail válido.'] }
              - { label: Link do Instagram, name: instagramUrl, widget: string, pattern: ['^https://(www\\.)?instagram\\.com/.+', 'Informe o link completo do Instagram.'] }
              - { label: Instagram exibido, name: instagramExibicao, widget: string }
              - { label: Local de atendimento, name: local, widget: string }
              - { label: Tempo de resposta, name: tempoResposta, widget: string }

  - name: identidade
    label: Identidade visual
    files:
      - name: fotos-e-logos
        label: Foto e logos
        file: content/marca.json
        format: json
        fields:
          - label: Imagens da marca
            name: marca
            widget: object
            fields:
              - { label: Foto da Karyne, name: foto, widget: image, hint: "Preferir imagem vertical e nítida." }
              - { label: Logo tema claro, name: logoClaro, widget: image }
              - { label: Logo tema escuro, name: logoEscuro, widget: image }

  - name: valores
    label: Valores e planos
    files:
      - name: cards-de-valores
        label: Editar cards de valores
        file: content/valores.json
        format: json
        fields:
          - label: Planos
            name: itens
            widget: planos-seguros

  - name: jogos
    label: Jogos educativos
    files:
      - name: cards-de-jogos
        label: Editar jogos e links de compra
        file: content/jogos.json
        format: json
        fields:
          - label: Jogos
            name: itens
            widget: jogos-seguros

  - name: agendamentos
    label: Rascunhos e agendamentos
    files:
      - name: agendamentos-de-conteudo
        label: Alterações programadas
        file: content/agendamentos.json
        format: json
        fields:
          - label: Alterações
            name: itens
            widget: list
            summary: "{{descricao}} — {{data}}"
            fields:
              - { label: Descrição da publicação, name: descricao, widget: string, hint: "Ex.: Atualizar horário das aulas de sábado" }
              - { label: Publicar em, name: data, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
              - label: Arquivo a alterar
                name: arquivo
                widget: select
                options: ["content/site.json", "content/agenda.json", "content/contatos.json", "content/valores.json", "content/jogos.json"]
              - { label: Campo a alterar, name: campo, widget: string, hint: "Ex.: horarios.observacao ou hero.titulo" }
              - { label: Novo texto, name: valor, widget: text }
              - { label: Ativo, name: ativo, widget: boolean, default: true }

  - name: registro
    label: Registro de versões
    files:
      - name: notas-de-publicacao
        label: Descreva sua publicação
        file: content/notas-publicacao.json
        format: json
        fields:
          - label: Notas de publicação
            name: itens
            widget: list
            summary: "{{data}} — {{descricao}}"
            fields:
              - { label: Data da publicação, name: data, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
              - { label: "O que foi alterado?", name: descricao, widget: text, hint: "Ex.: Atualizei os horários de atendimento de setembro." }
